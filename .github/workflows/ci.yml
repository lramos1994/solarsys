name: CI

# PR-only: branch protection requires these checks green (with the branch up to
# date) before merging, so a post-merge push re-run would test identical bytes.
# Pushes to main run the same gates in deploy.yml before publishing.
#
# Scope: typecheck, the headless Vitest layers, a production build, and the
# Playwright interaction suite on Chromium (behavioural, not timing-sensitive).
# The timing-calibrated suites (browser cadence, density, presentation) are
# deliberately NOT run here: they are calibrated for a developer machine and
# are flaky-slow on shared runners. Run `npm run test:all` locally before
# opening a PR.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (headless layers)
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Interaction tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (interaction)
        run: npm run test:interaction

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/.artifacts
          if-no-files-found: ignore
