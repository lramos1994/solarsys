name: CI

# PR-only: branch protection already requires this check to pass (with the
# branch up to date) before merging, so re-running the same bytes on the
# post-merge push would be redundant. Pushes to main only trigger the light
# Pages deploy.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, headless and browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test (headless + browser + interaction + density + reduced-motion + presentation)
        run: npm run test:all
