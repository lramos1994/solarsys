name: CI

# PR-only: branch protection requires this check green (with the branch up to
# date) before merging, so a post-merge push re-run would test identical bytes.
# Pushes to main only trigger the light Pages deploy.
#
# Scope: typecheck + the headless Vitest layers (geometry, determinism,
# structural — no browser). The Playwright matrix (browser, interaction,
# density, reduced-motion, presentation) is deliberately NOT run here: it is
# calibrated for a developer machine and is flaky-slow on shared runners.
# Run `npm run test:all` locally before opening a PR.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and headless tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (headless layers)
        run: npm run test
